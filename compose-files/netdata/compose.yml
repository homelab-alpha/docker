---
name: netdata

networks:
  netdata_net:
    attachable: false
    internal: false
    external: false
    name: netdata
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.4.0/24
          ip_range: 172.20.4.0/24
          gateway: 172.20.4.1
    driver_opts:
      com.docker.network.bridge.default_bridge: "false"
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
      com.docker.network.bridge.name: "netdata"
      com.docker.network.driver.mtu: "1500"
    labels:
      com.netdata.network.description: "is an isolated bridge network."

services:
  netdata_app:
    deploy:
      resources:
        limits:
          pids: "2048" # Limits the number of processes and threads (fork bomb protection).
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "1M"
        max-file: "2"
    stop_grace_period: 1m
    container_name: netdata
    image: ghcr.io/netdata/netdata:v2.13.0@sha256:176156c6754770e6157cc87394849a8e3047a13b52f393ff021093866f7f9e5c
    pull_policy: if_not_present
    depends_on:
      netdata_socket-proxy:
        condition: service_started
    volumes:
      - /docker/netdata/production/app/cache:/var/cache/netdata
      - /docker/netdata/production/app/config:/etc/netdata
      - /docker/netdata/production/app/lib:/var/lib/netdata
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /proc:/host/proc:ro
      - /run/dbus:/run/dbus:ro
      - /sys:/host/sys:ro
      - /var/log:/host/var/log:ro
    environment:
      TZ: Europe/Amsterdam # Adjust the timezone to match your local timezone. You can find the full list of timezones here https://en.wikipedia.org/wiki/List_of_tz_database_time_zones.
      DOCKER_USR: root
      DOCKER_HOST: netdata_socket-proxy:2375 # Resolves container names through the read-only socket proxy.
      NETDATA_EXTRA_APK_PACKAGES: lm-sensors
    domainname: netdata.local # Customize this with your own domain, e.g., `netdata.local` to `netdata.your-fqdn-here.com`.
    hostname: netdata
    networks:
      netdata_net:
        ipv4_address: 172.20.4.2
    ports:
      - "19999:19999/tcp" # HTTP
    security_opt:
      - apparmor:unconfined
      - no-new-privileges:true
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    labels:
      com.netdata.description: "is an infrastructure monitoring and troubleshooting."
    healthcheck:
      disable: false
      test: ["CMD", "/usr/sbin/health.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 5s

  netdata_socket-proxy:
    deploy:
      resources:
        limits:
          pids: "512" # Limits the number of processes and threads (fork bomb protection).
    # Read-only proxy for the Docker API. The app reaches Docker through this proxy instead of the socket.
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1M"
        max-file: "2"
    stop_grace_period: 1m
    container_name: netdata_socket-proxy
    image: lscr.io/linuxserver/socket-proxy:3.4.8-r0-ls107@sha256:6beb1743581ec3b2ed1a2bafd617e8c7a1d7ae2fe835293e333327618fc2b925
    pull_policy: if_not_present
    read_only: true
    tmpfs:
      - /run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: Europe/Amsterdam # Adjust the timezone to match your local timezone. You can find the full list of timezones here https://en.wikipedia.org/wiki/List_of_tz_database_time_zones.
      CONTAINERS: 1 # Allow GET /containers (list and inspect).
      POST: 0 # Read-only: only GET and HEAD requests reach Docker.
    hostname: netdata_socket-proxy
    networks:
      netdata_net:
        ipv4_address: 172.20.4.3
    security_opt:
      - no-new-privileges:true
    labels:
      com.netdata.socket-proxy.description: "is a read-only Docker API proxy for Netdata."
