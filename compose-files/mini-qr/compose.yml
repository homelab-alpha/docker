---
name: mini-qr

networks:
  mini-qr_net:
    attachable: false
    internal: false
    external: false
    name: mini-qr
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.26.0/24
          ip_range: 172.20.26.0/24
          gateway: 172.20.26.1
    driver_opts:
      com.docker.network.bridge.default_bridge: "false"
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
      com.docker.network.bridge.name: "mini-qr"
      com.docker.network.driver.mtu: "1500"
    labels:
      com.mini-qr.network.description: "is an isolated bridge network."

services:
  mini-qr_app:
    deploy:
      resources:
        limits:
          pids: 512 # Limits the number of processes and threads (fork bomb protection).
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1M"
        max-file: "2"
    stop_grace_period: 1m
    container_name: mini-qr
    image: ghcr.io/lyqht/mini-qr:v0.32.0@sha256:bca2ac7ccbec8899e6e9a6b91d45d0286238fa0fccf357fa10ca9640d2d09916
    pull_policy: if_not_present
    read_only: true # Read-only root file system; nginx writes only to the tmpfs paths below.
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Amsterdam # Adjust the timezone to match your local timezone. You can find the full list of timezones here https://en.wikipedia.org/wiki/List_of_tz_database_time_zones.
    hostname: mini-qr
    networks:
      mini-qr_net:
        ipv4_address: 172.20.26.2
    security_opt:
      - no-new-privileges:true
    labels:
      com.mini-qr.description:
        "A user-friendly and customizable QR code generator that allows you to create styled QR codes with ease."
    healthcheck:
      disable: true
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

  mini-qr_nginx:
    deploy:
      resources:
        limits:
          pids: 512 # Limits the number of processes and threads (fork bomb protection).
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1M"
        max-file: "2"
    stop_grace_period: 1m
    container_name: mini-qr_nginx
    image: docker.io/nginx:1.31.10-alpine3.24-perl@sha256:b1d560f4ec4914d5cf9ccba910e1c87a8f5cbc23b63fac556e8c71a652bd23fb
    pull_policy: if_not_present
    read_only: true # Read-only root file system; nginx writes only to the tmpfs paths below.
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    depends_on:
      mini-qr_app:
        condition: service_started
    volumes:
      - /docker/mini-qr/nginx-proxy.conf:/etc/nginx/nginx.conf
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Amsterdam # Adjust the timezone to match your local timezone. You can find the full list of timezones here https://en.wikipedia.org/wiki/List_of_tz_database_time_zones.
    domainname: mini-qr.local # Customize this with your own domain, e.g., `mini-qr.local` to `mini-qr.your-fqdn-here.com`.
    hostname: mini-qr-nginx
    networks:
      mini-qr_net:
        ipv4_address: 172.20.26.3
    ports:
      - "3017:80/tcp" # HTTP
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: # The minimum for nginx: bind port 80 and switch to the nginx user.
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    labels:
      com.mini-qr.description:
        "a flexible and high-performance server that can handle HTTP, mail, TCP, and UDP traffic."
    healthcheck:
      disable: true
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
